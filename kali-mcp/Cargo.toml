[package]
name = "kali-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing common Kali Linux security tools over stdio"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
